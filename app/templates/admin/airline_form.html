{% extends "admin/base_admin.html" %}
{% set active_nav = 'airlines' %}
{% block title %}{{ 'Edit Airline' if mode == 'edit' else 'New Airline' }} — QA Portal PIA{% endblock %}
{% block admin_content %}
<h2>{{ 'Edit Airline' if mode == 'edit' else 'New Airline' }}</h2>

<div class="table-card" style="max-width: 520px;">
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Airline Code</label>
      <input type="text" class="form-control text-uppercase" name="code" value="{{ form.code or '' }}" maxlength="10" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Airline Name</label>
      <input type="text" class="form-control" name="name" value="{{ form.name or '' }}" required>
    </div>
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
             {{ 'checked' if (form.is_active if mode == 'edit' else True) }}>
      <label class="form-check-label" for="is_active">Active</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">{{ 'Save Changes' if mode == 'edit' else 'Create Airline' }}</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('admin.airlines_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
