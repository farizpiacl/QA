{% extends "admin/base_admin.html" %}
{% set active_nav = 'users' %}
{% block title %}Reset Password — QA Portal PIA{% endblock %}
{% block admin_content %}
<h2>Reset Password</h2>
<p class="text-muted">For user <strong>{{ user.full_name }}</strong> ({{ user.username }})</p>

<div class="table-card" style="max-width: 480px;">
  <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" class="form-control" name="password" minlength="6" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control" name="confirm_password" minlength="6" required>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-warning" type="submit">Reset Password</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('admin.users_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
