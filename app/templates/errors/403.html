{% extends "base.html" %}
{% block title %}403 Forbidden — QA Portal PIA{% endblock %}
{% block content %}
<div class="error-shell">
  <div class="col-11 col-md-6 mx-auto">
    <i class="bi bi-slash-circle-fill text-danger" style="font-size: 2.5rem;"></i>
    <div class="error-code">403</div>
    <h4 class="mb-3">Access Denied</h4>
    <p class="text-muted">
      You do not have permission to access this page. If you believe this is
      a mistake, contact your administrator.
    </p>
    <a class="btn btn-primary mt-2" href="{{ url_for('main.dashboard') }}"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
  </div>
</div>
{% endblock %}
