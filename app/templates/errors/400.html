{% extends "base.html" %}
{% block title %}400 Bad Request — QA Portal PIA{% endblock %}
{% block content %}
<div class="error-shell">
  <div class="col-11 col-md-6 mx-auto">
    <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 2.5rem;"></i>
    <div class="error-code">400</div>
    <h4 class="mb-3">Request Could Not Be Processed</h4>
    <p class="text-muted">
      {{ reason or "There was a problem with your request. Please go back and try again." }}
    </p>
    <a class="btn btn-primary mt-2" href="{{ url_for('main.dashboard') }}"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
  </div>
</div>
{% endblock %}
