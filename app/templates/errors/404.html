{% extends "base.html" %}
{% block title %}404 Not Found — QA Portal PIA{% endblock %}
{% block content %}

    <i class="bi bi-signpost-split-fill text-secondary" style="font-size: 2.5rem;"></i>
    <div class="error-code">404</div>
    <h4 class="mb-3">Page Not Found</h4>

</div>
{% endblock %}
