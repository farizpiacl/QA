{% extends "base.html" %}
{% block title %}Change Password — QA Portal PIA{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3 text-center">Change Password</h4>
        <p class="text-muted text-center mb-4">
          {% if forced %}
            You're signed in with a default password. Set a new password to continue.
          {% else %}
            Set a new password for your account.
          {% endif %}
        </p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="current_password">Current Password</label>
            <input class="form-control" type="password" id="current_password" name="current_password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="new_password">New Password</label>
            <input class="form-control" type="password" id="new_password" name="new_password" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm New Password</label>
            <input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="6" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
